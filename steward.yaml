schema: steward/v1
repo:
  id: dart_changesets
  archetype: cli_tool
  archetype_detection:
    confidence: 1.0
    signals:
      - 'explicit --archetype'

harness:
  name: steward
  mode: cli
  entrypoints:
    cli: steward

adoption:
  status: adopting
  owner: dart_changesets
  gate:
    pillar: quality

stewardship:
  governance:
    north_star: doc/NORTH_STAR.md
    adr_dir: doc/decisions
    faq:
      design: doc/DESIGN_FAQ.md
      dx: doc/DX_FAQ.md
  knowledge:
    docs_map: AGENTS.md
    agent_map: AGENTS.md
    source_policy: required_for_external_claims
  repo_quality:
    contract_spec: steward.yaml
    maturity_model: general_stewardship
  skill_lifecycle:
    installable_skills: false
    registry: skills.json
  quality:
    validate: 'dart test'
    evidence: .steward/evidence
  harness:
    enabled: false
    action_contract: deferred
  release:
    changelog: CHANGELOG.md
    artifact_provenance: required
  review_handoff:
    # true = ADR-level architecture may use MoE. Not a preflight for ordinary edits.
    moe_required_for_architecture: false
  strategic_alignment:
    vision_source: doc/NORTH_STAR.md
    success_evidence: required
    falsifiers: doc/NORTH_STAR.md#falsifiers
  security:
    action_effects: required
    redaction: steward/redaction/v1
  org:
    owners: CONTRIBUTING.md

actions: {}

probes: {}

diagnostics:
  cases: {}

unknown_cases:
  path: .steward/unknown-cases/
  retention: local

provenance:
  dependencies: []
  artifacts: []
  benchmarks: []
