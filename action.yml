# dart_changesets — GitHub Action (composite).
#
# Modeled after @changesets/action: ONE step in ONE workflow on push to main
# handles both halves of the release train:
#   1. pending intent files (.changesets/*.md) exist
#        → apply the computed train onto the version branch and open/update
#          the "chore: version packages" pull request;
#   2. this push IS the version-PR merge (commit message match + the train
#      artifact present at HEAD)
#        → push one <package>-v<version> tag per release and dispatch one
#          publish workflow run per tag.
#
# Per-tag fan-out is pub.dev's architecture: automated publishing is
# ref-gated to the package's own tag, so a single run cannot publish a whole
# train. Ordering emerges from dependency waits plus skip-existing
# self-healing inside the publish workflow.
#
# Usage (consumer repository, .github/workflows/release.yml):
#   name: Release
#   on: { push: { branches: [main] } }
#   jobs:
#     release:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@v4
#           with: { fetch-depth: 0 }
#         - uses: Arenukvern/dart_changesets@v1
#           env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
#
# Plus a publish workflow (see example/consumer-workflows/publish.yml).
name: dart_changesets
description: >-
  Changesets-style release engine for Dart & Flutter: intent files →
  version PR → per-tag pub.dev publish dispatch.
branding:
  icon: tag
  color: blue

inputs:
  engine-repo:
    description: >
      Repository to install the engine from. Defaults to the repository
      this action was loaded from.
    required: false
    default: ''
  engine-ref:
    description: >
      Ref of the engine repository to install. Defaults to the ref this
      action was loaded from, falling back to main.
    required: false
    default: ''
  cwd:
    description: The consumer repository working directory.
    required: false
    default: '.'
  branch:
    description: The version-PR branch.
    required: false
    default: 'changesets/version-packages'
  commit:
    description: The version-PR commit message (also the merge detector).
    required: false
    default: 'chore: version packages'
  title:
    description: The version-PR title.
    required: false
    default: 'chore: version packages'
  setup-git-user:
    description: Configure the github-actions bot identity before pushing.
    required: false
    default: 'true'
  publish:
    description: >
      Push tags and dispatch publish runs when this push merged the version
      PR. Set false to only ever assemble version PRs.
    required: false
    default: 'true'
  publish-workflow:
    description: >
      Consumer workflow file dispatched per tag (must accept `tag` and
      `execute` workflow_dispatch inputs).
    required: false
    default: 'publish.yml'
  token:
    description: >
      Token used for every branch push, PR create/edit, tag push, release
      creation and workflow dispatch. Defaults to github.token. A PAT (or
      App token) makes the version PR run full CI: pushes made with
      GITHUB_TOKEN trigger no workflows. Note that actions/checkout
      persists its own credential in git config — when a custom token is
      set, the action overrides that credential before pushing.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: dart-lang/setup-dart@v1

    - name: Install dart_changesets engine
      id: engine
      shell: bash
      env:
        INPUT_ENGINE_REPO: ${{ inputs.engine-repo }}
        INPUT_ENGINE_REF: ${{ inputs.engine-ref }}
      run: |
        set -euo pipefail
        repo="${INPUT_ENGINE_REPO:-${GITHUB_ACTION_REPOSITORY:-Arenukvern/dart_changesets}}"
        ref="${INPUT_ENGINE_REF:-${GITHUB_ACTION_REF:-main}}"
        echo "engine: $repo @ $ref"
        dart pub global activate --source git \
          "https://github.com/${repo}.git" --git-ref "$ref"

    # checkout@v4 persists its own credential in git config; a custom token
    # must override it or pushes silently keep riding GITHUB_TOKEN (which
    # fires no workflows).
    - name: Override push credential with token
      if: inputs.token != ''
      shell: bash
      run: |
        set -euo pipefail
        git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
        git config http.https://github.com/.extraheader \
          "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${{ inputs.token }}" | base64)"

    - name: Detect mode
      id: mode
      shell: bash
      working-directory: ${{ inputs.cwd }}
      env:
        COMMIT_PREFIX: ${{ inputs.commit }}
        INPUT_PUBLISH: ${{ inputs.publish }}
        BRANCH: ${{ inputs.branch }}
        GH_TOKEN: ${{ inputs.token || github.token }}
      run: |
        set -euo pipefail
        # Pending intent files (README.md and dot-files excluded by the engine).
        pending=$(find .changesets -maxdepth 1 -name '*.md' ! -name 'README.md' ! -name '.*' 2>/dev/null | wc -l | tr -d ' ')
        train=".changesets/.pending-train.json"
        head_msg="$(git log -1 --pretty=%s)"
        head_sha="$(git rev-parse HEAD)"

        # The commit-message prefix only matches SQUASH merges ("chore:
        # version packages"). A merge-COMMIT merge carries the PR's merge
        # message instead, so identify it by the PR itself: this HEAD is the
        # merge commit of the version PR (oka, 2026-11-22 — a merge-commit
        # merge no-op'd here and the train stalled until tags were pushed
        # by hand).
        pr_merge_sha=""
        if [ -f "$train" ]; then
          pr_merge_sha="$(gh pr view "$BRANCH" --json state,mergeCommit \
            --jq 'select(.state == "MERGED") | .mergeCommit.oid' 2>/dev/null || true)"
        fi

        if [ "$pending" -gt 0 ]; then
          echo "result=assemble" >> "$GITHUB_OUTPUT"
        elif [ "$INPUT_PUBLISH" = "true" ] && [ -f "$train" ] && { [[ "$head_msg" == "$COMMIT_PREFIX"* ]] || { [ -n "$pr_merge_sha" ] && [ "$pr_merge_sha" = "$head_sha" ]; }; }; then
          echo "result=release" >> "$GITHUB_OUTPUT"
        else
          echo "result=none" >> "$GITHUB_OUTPUT"
        fi

    - name: Assemble version PR
      if: steps.mode.outputs.result == 'assemble'
      shell: bash
      working-directory: ${{ inputs.cwd }}
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        BRANCH: ${{ inputs.branch }}
        COMMIT: ${{ inputs.commit }}
        TITLE: ${{ inputs.title }}
        SETUP_GIT_USER: ${{ inputs.setup-git-user }}
      run: |
        set -euo pipefail
        if [ "$SETUP_GIT_USER" = "true" ]; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        fi
        # Update the version branch in place only while its PR is OPEN.
        # Once that PR is merged or closed, the branch's train is already on
        # main — a stale branch would make the next assemble replay an old
        # train (zero pending intents) instead of building the new one, so
        # the branch must be recreated from the current main.
        pr_state="$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || echo none)"
        if [ "$pr_state" = "OPEN" ] && git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
        else
          git checkout -B "$BRANCH"
        fi
        dart_changesets version
        if git diff --quiet && git diff --cached --quiet; then
          echo "No file changes after apply — the version branch is current."
        else
          git add -A
          git commit -m "$COMMIT"
          git push --force-with-lease origin "$BRANCH"
        fi
        # The PR is ensured on every assemble run: an earlier run may have
        # pushed the branch but failed to create the PR (e.g. the repo-level
        # "Allow GitHub Actions to create and approve pull requests" setting
        # was off), and a re-run must repair that instead of exiting early.
        # A merged/closed PR for this branch does NOT count — the branch was
        # rewritten above, so a fresh PR must be created.
        if [ -f .changesets/.pending-train.json ]; then
          body=$(cat .changesets/.pending-train.json)
        else
          body="Release train"
        fi
        if [ "$pr_state" = "OPEN" ]; then
          gh pr edit "$BRANCH" --body "Release train:"$'\n'"$body"
        else
          gh pr create --base main --head "$BRANCH" \
            --title "$TITLE" \
            --body "Release train:"$'\n'"$body"$'\n\n'"Merging pushes one tag per package and dispatches one publish run per tag."
        fi

    - name: Push tags and dispatch publish runs
      if: >-
        inputs.publish == 'true' && steps.mode.outputs.result == 'release'
      shell: bash
      working-directory: ${{ inputs.cwd }}
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        PUBLISH_WORKFLOW: ${{ inputs.publish-workflow }}
        HAS_PAT: ${{ inputs.token != '' }}
      run: |
        set -euo pipefail
        merge_sha="$(git rev-parse HEAD)"
        # Tags are pushed ONE PER ITERATION, never batched: GitHub fires
        # push-triggered workflows for at most ~3 refs of a single push, so
        # a batched push would silently drop publish legs (oka, 2026-11-22).
        for tag in $(dart_changesets tags --plain); do
          echo "== $tag =="
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag exists; skipping creation"
          else
            git tag "$tag" "$merge_sha"
            git push origin "$tag"
          fi
          # pub.dev's automated publishing authorizes ONLY tag-push events —
          # a workflow_dispatch run is rejected for real publishes
          # (dart.dev/go/publishing-from-github). And GITHUB_TOKEN tag
          # pushes fire no workflows. Together: real publishing requires
          # the token input (a PAT) so the pushes above START the
          # consumer's push-triggered publish workflow themselves.
          if [ "$HAS_PAT" = "true" ]; then
            echo "token input set: the push above fires the publish workflow (push event — pub.dev-authorized); no dispatch."
          else
            echo "no token input (GITHUB_TOKEN): the push fired nothing; dispatching a PREFLIGHT run (execute=false). pub.dev rejects workflow_dispatch publishes — provide a PAT via the token input for real publishes."
            gh workflow run "$PUBLISH_WORKFLOW" \
              --ref "$GITHUB_REF_NAME" \
              -f tag="$tag" \
              -f execute=false
          fi
        done

        # Product tag + GitHub release: exactly once per train, idempotent.
        # The engine computes the tag and the notes (action stays thin).
        # Downstream builds must NOT be dispatched here — at merge time the
        # pub.dev publish legs have not landed, so a binary build resolving
        # the new versions would fail. Chain them off the publish run
        # instead (needs: publish in the consumer's per-tag workflow) or
        # set product-dispatch-workflow on the reusable publish workflow.
        product_out="$(dart_changesets product-release)"
        ptag="$(echo "$product_out" | sed -n 's/^tag=//p')"
        if [ -n "$ptag" ]; then
          ppkg="$(echo "$product_out" | sed -n 's/^package=//p')"
          pver="$(echo "$product_out" | sed -n 's/^version=//p')"
          echo "== product $ppkg → $ptag =="
          if git rev-parse -q --verify "refs/tags/$ptag" >/dev/null; then
            echo "product tag exists; skipping creation"
          else
            git tag "$ptag" "$merge_sha"
            git push origin "$ptag"
          fi
          if gh release view "$ptag" --json id --jq .id >/dev/null 2>&1; then
            echo "product release exists; skipping creation"
          else
            dart_changesets release-notes --package "$ppkg" \
              --version "$pver" > product-notes.md
            gh release create "$ptag" \
              --target "$merge_sha" \
              --title "$ptag" \
              --notes-file product-notes.md
            rm -f product-notes.md
          fi
        fi

    - name: Nothing to do
      if: steps.mode.outputs.result == 'none'
      shell: bash
      run: echo "No pending changesets and no version-PR merge — nothing to release."
