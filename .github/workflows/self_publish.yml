# Self-hosting publish trigger for this repository (dogfooding).
# Forwards tag pushes and dispatches to the reusable publish workflow.
name: dart_changesets publish (self)

on:
  push:
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. dart_changesets-v0.1.1'
        required: true
        type: string
      execute:
        description: 'Publish for real (unchecked = preflight)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: dart-changesets-publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      execute: ${{ github.event_name == 'push' || inputs.execute }}
