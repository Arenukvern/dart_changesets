# Reusable per-tag pub.dev publish workflow.
#
# Consumers call this from their own trigger workflow (workflow_call), which
# keeps pub.dev's per-tag ref gating happy: each run publishes exactly the
# package its tag names. Requires id-token: write (pub.dev OIDC automated
# publishing; no stored secrets).
#
# Consumer template (see example/consumer-workflows/publish.yml):
#   jobs:
#     publish:
#       uses: Arenukvern/dart_changesets/.github/workflows/publish.yml@v1
#       with: { tag: <tag>, execute: true }
#       permissions: { contents: read, id-token: write }
name: dart_changesets publish (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag, e.g. my_package-v1.2.3'
        required: true
        type: string
      execute:
        description: 'Publish for real (false = preflight only)'
        required: false
        type: boolean
        default: true
      engine-ref:
        description: 'Engine ref to install (defaults to this repo default branch)'
        required: false
        type: string
        default: ''
      cwd:
        description: 'Consumer repository working directory'
        required: false
        type: string
        default: '.'
      flutter-version:
        description: >
          Flutter SDK version for flutter-needing runs (stable channel).
          Empty = the latest stable release, which keeps release trains
          maintenance-free across Flutter cadence. Pin an exact version
          only when your workspace's resolution requires it.
        required: false
        type: string
        default: ''
      product-dispatch-workflow:
        description: >
          Consumer workflow file dispatched (workflow_dispatch) AFTER this
          tag's publish succeeds, when the tag names the configured product
          package (product_tag in changesets.yaml). This is the correct hook
          point for binary/registry builds: at version-PR merge time the
          publish legs have not landed yet, so a build resolving the new
          versions would fail. Empty = no dispatch (chain a `needs:` job in
          your own per-tag workflow instead).
        required: false
        type: string
        default: ''
      product-dispatch-input:
        description: 'Input name receiving the product tag in the dispatched workflow.'
        required: false
        type: string
        default: 'tag'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checks out the CALLER repository when invoked via workflow_call.
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Install engine
        run: |
          ref="${{ inputs.engine-ref }}"
          if [ -z "$ref" ]; then ref="${GITHUB_ACTION_REF:-main}"; fi
          dart pub global activate --source git \
            "https://github.com/${GITHUB_ACTION_REPOSITORY:-Arenukvern/dart_changesets}.git" \
            --git-ref "$ref"

      - name: Detect package runner (engine knows the layout)
        id: runner
        working-directory: ${{ inputs.cwd }}
        run: |
          runner="$(dart_changesets runner --tag "${{ inputs.tag }}")"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

      # The Flutter SDK is installed ONLY when the workspace needs it:
      # `pub publish` inside a pub-workspace member resolves the whole
      # workspace, so any `sdk: flutter` member requires the SDK even for
      # a dart-only tag. Pure-Dart repositories (and dart-only fallback
      # discovery) never pay for it. The SDK cache (tool cache, keyed on
      # channel/version/arch) makes every run after the first per version
      # a fast restore.
      - uses: subosito/flutter-action@v2
        if: steps.runner.outputs.runner == 'flutter'
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Publish this tag's package
        working-directory: ${{ inputs.cwd }}
        run: |
          execute_flag=""
          if [ "${{ inputs.execute }}" = "true" ]; then execute_flag="--execute"; fi
          dart_changesets publish-tag \
            --tag "${{ inputs.tag }}" $execute_flag --skip-existing

      # Fires only for the product package's tag and only after the publish
      # succeeded — a GITHUB_TOKEN tag push fires no push workflows, so this
      # explicit dispatch is how downstream product builds start.
      - name: Dispatch product workflow
        if: inputs.product-dispatch-workflow != '' && inputs.execute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ptag="$(dart_changesets product-release --tag "${{ inputs.tag }}")"
          if [ -z "$ptag" ]; then
            echo "not the product tag; nothing to dispatch"
            exit 0
          fi
          gh workflow run "${{ inputs.product-dispatch-workflow }}" \
            --ref "${{ github.ref_name }}" \
            -f "${{ inputs.product-dispatch-input }}=$ptag"
