# Reusable per-tag pub.dev publish workflow.
#
# Consumers call this from their own trigger workflow (workflow_call), which
# keeps pub.dev's per-tag ref gating happy: each run publishes exactly the
# package its tag names. Requires id-token: write (pub.dev OIDC automated
# publishing; no stored secrets).
#
# Consumer template (see example/consumer-workflows/publish.yml):
#   jobs:
#     publish:
#       uses: Arenukvern/dart_changesets/.github/workflows/publish.yml@v1
#       with: { tag: <tag>, execute: true }
#       permissions: { contents: read, id-token: write }
name: dart_changesets publish (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag, e.g. my_package-v1.2.3'
        required: true
        type: string
      execute:
        description: 'Publish for real (false = preflight only)'
        required: false
        type: boolean
        default: true
      engine-ref:
        description: 'Engine ref to install (defaults to this workflow file’s commit)'
        required: false
        type: string
        default: ''
      cwd:
        description: 'Consumer repository working directory'
        required: false
        type: string
        default: '.'
      flutter-version:
        description: >
          Flutter SDK version for flutter-needing runs (stable channel).
          Empty = the latest stable release, which keeps release trains
          maintenance-free across Flutter cadence. Pin an exact version
          only when your workspace's resolution requires it.
        required: false
        type: string
        default: ''
      product-dispatch-workflow:
        description: >
          Consumer workflow file dispatched (workflow_dispatch) AFTER this
          tag's publish succeeds, when the tag names the configured product
          package (product_tag in changesets.yaml). This is the correct hook
          point for binary/registry builds: at version-PR merge time the
          publish legs have not landed yet, so a build resolving the new
          versions would fail. Empty = no dispatch (chain a `needs:` job in
          your own per-tag workflow instead).
        required: false
        type: string
        default: ''
      product-dispatch-input:
        description: 'Input name receiving the product tag in the dispatched workflow.'
        required: false
        type: string
        default: 'tag'
      dependency-wait-minutes:
        description: >
          How long publish-tag waits for same-train dependency floors to land
          on pub.dev before failing (runs poll with progress logs). Raise it
          for workspaces whose members take minutes to build and publish;
          0 disables the wait and fails fast on a racing train.
        required: false
        type: string
        default: '15'
      skip-dependency-gate:
        description: >
          Publish as-is without the dependency gate (warning logged; pub.dev
          upload validation remains the arbiter). For recovery flows that
          intentionally publish against floors that are not visible yet.
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Worst case: full dependency-wait budget + setup + dry-run + publish +
    # visibility poll must fit.
    timeout-minutes: 30
    steps:
      # Checks out the CALLER repository when invoked via workflow_call.
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1

      - name: Install engine
        env:
          ENGINE_REF: ${{ inputs.engine-ref }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          ref="${ENGINE_REF}"
          repo="${JOB_WORKFLOW_REPOSITORY:-Arenukvern/dart_changesets}"
          if [ -z "$ref" ]; then
            if [ -n "${JOB_WORKFLOW_SHA:-}" ]; then
              ref="${JOB_WORKFLOW_SHA}"
            else
              echo "::warning::job.workflow_sha unavailable — installing engine from main"
              ref="main"
            fi
          fi
          if [ -z "${JOB_WORKFLOW_REPOSITORY:-}" ]; then
            echo "::warning::job.workflow_repository unavailable — defaulting repo to Arenukvern/dart_changesets"
            repo="Arenukvern/dart_changesets"
          fi
          echo "engine: ${repo} @ ${ref}"
          dart pub global activate --source git \
            "https://github.com/${repo}.git" --git-ref "$ref"

      - name: Detect package runner (engine knows the layout)
        id: runner
        working-directory: ${{ inputs.cwd }}
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          runner="$(dart_changesets runner --tag "$INPUT_TAG")"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

      # The Flutter SDK is installed ONLY when the workspace needs it:
      # `pub publish` inside a pub-workspace member resolves the whole
      # workspace, so any `sdk: flutter` member requires the SDK even for
      # a dart-only tag. Pure-Dart repositories (and dart-only fallback
      # discovery) never pay for it. The SDK cache (tool cache, keyed on
      # channel/version/arch) makes every run after the first per version
      # a fast restore.
      - uses: subosito/flutter-action@v2
        if: steps.runner.outputs.runner == 'flutter'
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Publish this tag's package
        working-directory: ${{ inputs.cwd }}
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_EXECUTE: ${{ inputs.execute }}
          INPUT_SKIP_GATE: ${{ inputs.skip-dependency-gate }}
          INPUT_WAIT: ${{ inputs.dependency-wait-minutes }}
        run: |
          set -euo pipefail
          execute_flag=""
          if [ "$INPUT_EXECUTE" = "true" ]; then execute_flag="--execute"; fi
          gate_flag=""
          if [ "$INPUT_SKIP_GATE" = "true" ]; then gate_flag="--skip-dependency-gate"; fi
          dart_changesets publish-tag \
            --tag "$INPUT_TAG" $execute_flag --skip-existing $gate_flag \
            --dependency-wait-minutes "$INPUT_WAIT"

      # Fires only for the product package's tag and only after the publish
      # succeeded — a GITHUB_TOKEN tag push fires no push workflows, so this
      # explicit dispatch is how downstream product builds start.
      - name: Dispatch product workflow
        if: inputs.product-dispatch-workflow != '' && inputs.execute
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          PRODUCT_WORKFLOW: ${{ inputs.product-dispatch-workflow }}
          PRODUCT_INPUT: ${{ inputs.product-dispatch-input }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ptag="$(dart_changesets product-release --tag "$INPUT_TAG")"
          if [ -z "$ptag" ]; then
            echo "not the product tag; nothing to dispatch"
            exit 0
          fi
          dispatch_ref="$DISPATCH_REF"
          if git rev-parse -q --verify "refs/tags/$ptag" >/dev/null 2>&1; then
            dispatch_ref="$ptag"
          fi
          gh workflow run "$PRODUCT_WORKFLOW" \
            --ref "$dispatch_ref" \
            -f "${PRODUCT_INPUT}=$ptag"