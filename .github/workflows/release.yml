# Self-hosting release train (dogfooding): this repository releases
# dart_changesets through its own action.
name: dart_changesets release (self)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # workflow_dispatch creation (gh workflow run) needs actions: write.
  actions: write

concurrency:
  group: dart-changesets-self-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./
        with:
          # The engine's own per-tag trigger workflow is self_publish.yml
          # (this repo has no consumer-style publish.yml with
          # workflow_dispatch — its publish.yml is the reusable
          # workflow_call template).
          publish-workflow: self_publish.yml
          # pub.dev authorizes automated publishing ONLY from tag-push
          # events, and GITHUB_TOKEN pushes fire no workflows — so real
          # publishes need a PAT here (unset → falls back to GITHUB_TOKEN
          # and trains stop at preflight). This is the same role the
          # release-please PAT played: reuse your existing
          # RELEASE_PLEASE_TOKEN secret (Contents: write). It also makes
          # version-PR pushes run full CI.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
