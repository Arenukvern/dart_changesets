# Self-hosting release train (dogfooding): this repository releases
# dart_changesets through its own action.
name: dart_changesets release (self)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # workflow_dispatch creation (gh workflow run) needs actions: write.
  actions: write

concurrency:
  group: dart-changesets-self-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./
        with:
          # The engine's own per-tag trigger workflow is self_publish.yml
          # (this repo has no consumer-style publish.yml with
          # workflow_dispatch — its publish.yml is the reusable
          # workflow_call template).
          publish-workflow: self_publish.yml
          # Optional PAT (Contents: write): tag pushes start push-triggered
          # publish legs and version-PR branches run full CI. Unset →
          # GITHUB_TOKEN + workflow_dispatch on each package tag (enable
          # pub.dev Admin → workflow_dispatch publishing for OIDC).
          # token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
