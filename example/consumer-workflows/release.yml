# Consumer template: .github/workflows/release.yml
# The single workflow every adopting repository needs on push to main.
# The action assembles the version PR from pending intent files and, when
# the version PR merges, pushes tags and dispatches publish runs.
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  # workflow_dispatch creation (the action starts publish runs via
  # `gh workflow run`) needs actions: write.
  actions: write

concurrency:
  group: dart-changesets-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: Arenukvern/dart_changesets@v1
        with:
          # Optional PAT (Contents: write) so tag pushes start your
          # push-triggered publish workflow and version-PR CI runs. Without
          # it the action dispatches publish on each tag ref via
          # workflow_dispatch — enable that on pub.dev Admin for OIDC
          # publishes, or set this to your RELEASE_PLEASE_TOKEN secret.
          # token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Optional inputs (defaults shown):
        #   branch: changesets/version-packages
        #   commit: chore: version packages
        #   publish-workflow: publish.yml
        #   engine-ref: v1
