# Consumer template: .github/workflows/publish.yml
# The per-tag publish leg. pub.dev's automated publishing is ref-gated, so
# each run publishes exactly the package its tag names; the dart_changesets
# action dispatches one run per tag when the version PR merges.
name: dart_changesets publish

on:
  push:
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. my_package-v1.2.3'
        required: true
        type: string
      execute:
        description: 'Publish for real (unchecked = preflight)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: dart-changesets-publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: Arenukvern/dart_changesets/.github/workflows/publish.yml@v1
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      execute: ${{ github.event_name == 'push' || inputs.execute }}
      # Flutter SDK version (default: latest stable — maintenance-free; the
      # SDK is installed only when the workspace actually needs it).
      # Pin an exact version only when your workspace's resolution needs it:
      # flutter-version: '3.47.5'
      # Optional: dispatch a downstream workflow (e.g. binary builds) AFTER
      # this tag's publish succeeds, when the tag names the product package
      # configured under product_tag in changesets.yaml:
      # product-dispatch-workflow: release.yml
      # product-dispatch-input: release_tag
      # Optional: pin the engine ref (default: called workflow file's commit
      # via github.job.workflow_sha in Arenukvern/dart_changesets).
      # engine-ref: v1
