name: dart_changesets
description: >-
  Changesets-style release engine for Dart monorepos: intent files,
  graph-aware version PRs, and per-tag pub.dev publish trains. Also a
  GitHub Action (action.yml) so one workflow wires the whole flow.
version: 0.3.0
homepage: https://github.com/Arenukvern/dart_changesets
repository: https://github.com/Arenukvern/dart_changesets
issue_tracker: https://github.com/Arenukvern/dart_changesets/issues
topics:
  - changesets
  - release-automation
  - publishing
  - versioning

environment:
  sdk: ^3.14.0

dependencies:
  args: ^2.7.0
  path: ^1.9.0
  pub_semver: ^2.2.0
  yaml: ^3.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.0

executables:
  dart_changesets:
